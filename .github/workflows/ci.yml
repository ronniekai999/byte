name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byte-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-bundle:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show toolchain
        run: swift --version
      - name: Build app
        run: swift build
      - name: Run regression tests
        run: swift test
      - name: Build release app bundle
        run: ./bundle.sh
      - name: Validate bundle metadata
        run: plutil -lint Byte.app/Contents/Info.plist
